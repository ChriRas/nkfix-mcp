[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "nkfix-mcp"
version = "0.1.0"
description = "MCP-Server für NebenkostenFix: ein KI-Assistent liest den Bestand und erfasst Rechnungen, Zählerstände und Zahlungen über die JSON-API."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Christoph Raschke" }]
keywords = ["mcp", "nebenkostenfix", "nebenkostenabrechnung", "claude", "model-context-protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: German",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Office/Business :: Financial :: Accounting",
]
# Pinned like the main project: an install tomorrow should get the versions
# the tests ran against. The server API of mcp changed with major 2
# (FastMCP -> MCPServer); a silent upgrade to 3 would be just as much of a
# break. mcp pulls in httpx2, anyio and pydantic anyway; the server imports
# them directly, so they are listed explicitly. requirements.txt pins all
# other versions (uv pip compile).
dependencies = [
    "mcp==2.3.0",
    "httpx2==2.16.0",
    "anyio==4.15.1",
    "pydantic==2.14.1",
]

[project.urls]
Repository = "https://github.com/ChriRas/nkfix-mcp"
Issues = "https://github.com/ChriRas/nkfix-mcp/issues"

[project.scripts]
nkfix-mcp = "nkfix_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nkfix_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -p no:cacheprovider --import-mode=importlib"
markers = [
    "contract: contract test against a real NebenkostenFix instance (needs NKF_SOURCE)",
]

[tool.mypy]
# The package is checked strictly; the tests are not (fixtures and parametrized
# arguments stay untyped, see the ruff ANN exemption for tests).
strict = true
files = ["src"]
python_version = "3.11"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "ANN", "D", "PT", "S", "ERA", "C4", "PTH", "TRY", "RET",
]
ignore = [
    # Messages are German texts for people and the model; they belong at the raise.
    "TRY003",
    # Models document themselves through Field descriptions, tools through their docstring
    # (which is the description the model reads); a docstring on every class would repeat that.
    # Public helpers (register, format_money, from_response, ...) are named for what they do;
    # where that is not enough, they have a docstring.
    "D101", "D102", "D103", "D105", "D107",
    # The JSON of the NebenkostenFix API is untyped; Any marks exactly that boundary.
    "ANN401",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"src/nkfix_mcp/tools/*.py" = [
    # A tool takes what the model may pass; record_invoice has 19 fields.
    "PLR0913", "PLR0917",
    # register() defines the tools as closures, so it is long by design.
    "PLR0915",
    # Tool docstrings are the description the model reads; their wording and layout stay as they are.
    "D205", "D209",
]
"tests/**/*.py" = [
    "S101",     # pytest asserts
    "S105", "S106", "S603", "S607",  # fake credentials, subprocess for the test instance
    "D",        # test names say what is tested
    "ANN",      # fixtures and parametrized arguments; mypy checks the package, not the tests
    "PLR2004",  # expected values in tests are meant literally
    "PLR0913", "PLR0917",
    "PLC0415",  # imports inside a test keep its scope visible
]
